name: Feature Request
description: Suggest an idea or enhancement for this project
title: "[Feature] "
labels: enhancement, triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose a new feature!
        We really appreciate the community efforts to improve ollama-rag-webapp.
  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please make sure to search in the [issues](https://github.com/bomin0624/ollama-rag-webapp/issues)
        first to see whether the same feature was requested already.
      options:
        - label: >
            I had searched in the [issues](https://github.com/bomin0624/ollama-rag-webapp/issues) and found
            no similar feature requirement.
          required: true
  - type: textarea
    attributes:
      label: Problem / Motivation
      description: >
        Is your feature request related to a problem? A clear and concise description of what the
        problem is.
      placeholder: >
        Rather than telling us how you might implement this feature, try to take a step back and
        describe what you are trying to achieve.
  - type: textarea
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context, references, or screenshots about the feature request here.
  - type: checkboxes
    attributes:
      label: Are you willing to submit a PR?
      description: >
        This is absolutely not required, but we are happy to guide you in the contribution process
        especially if you already have a good understanding of how to implement the feature.
      options:
        - label: Yes I am willing to submit a PR!
  - type: markdown
    attributes:
      value: "Thanks for completing our form!"
