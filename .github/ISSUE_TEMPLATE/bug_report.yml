name: Bug Report
title: "[Bug]: "
description: Report a bug to help us improve
labels: bug, triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting the problem!
        Please make sure what you are reporting is a bug with reproducible steps.
  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please make sure to search in the [issues](https://github.com/CheyuWu/ollama-rag-webapp/issues)
        first to see whether the same issue was reported already.
      options:
        - label: >
            I searched the [issues](https://github.com/CheyuWu/ollama-rag-webapp/issues) and found no
            similar issues.
          required: true
  - type: textarea
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Behavior
      description: >
        What actually happened. Include the full error message or stack trace.

        **NOTE**: please copy and paste texts instead of taking screenshots of them for easy future search.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Please complete the following information.
      value: |
        - OS:
        - Python version:
        - Ollama version / model:
        - Embedding model & dimension:
        - Dataset (BEIR):
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant Config / Logs
      description: Paste relevant configuration values and log output.
      render: shell
  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
  - type: checkboxes
    attributes:
      label: Are you willing to submit a PR?
      description: >
        This is absolutely not required, but we are happy to guide you in the contribution process
        especially if you already have a good understanding of how to implement the fix.
      options:
        - label: Yes I am willing to submit a PR!
  - type: markdown
    attributes:
      value: "Thanks for completing our form!"
