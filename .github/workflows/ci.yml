name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install
      
      - name: Show debug info
        run: |
          git rev-parse HEAD
          uv run ruff --version
          sed -n '1,20p' src/generator.py
          sed -n '1,130p' src/retriever.py

      - name: Run checks
        run: make ci
