[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beir>=2.2.0",
    "faiss-cpu>=1.13.2",
    "langchain>=1.2.3",
    "langchain-classic>=1.0.1",
    "langchain-community>=0.4.1",
    "langchain-chroma>=1.1.0",
    "sentence-transformers>=5.2.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "langchain-huggingface>=1.2.0",
    "fastapi[standard]>=0.136.0",
    "uvicorn>=0.41.0",
    "langsmith>=0.6.2",
    "openai>=2.53.0",
    "ragas>=0.4.3",
    "anthropic>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
# Only collect the unit tests. evaluate/ is the BEIR evaluation entry point
# (`make evaluate`), not a pytest suite.
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
